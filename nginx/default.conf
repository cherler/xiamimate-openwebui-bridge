map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream openwebui {
    server open-webui:8080;
}

upstream chatbackend {
    server host.docker.internal:8200;
}

server {
    listen 8080;

    client_max_body_size 50m;

    location = /health {
        proxy_pass         http://openwebui/health;
        include /etc/nginx/includes/proxy_common_headers.conf;
    }

    # ── 统一导航栏注入 ──
    sub_filter_once on;
    sub_filter '</head>' '<link rel="stylesheet" href="/_xm/nav.css?v=20260421-portal-nav2"><script defer src="/_xm/nav.js?v=20260421-portal-nav2"></script></head>';

    location = /_openwebui_user_check {
        internal;
        proxy_pass              http://openwebui/api/v1/users/user/settings;
        include /etc/nginx/includes/proxy_auth_request_headers.conf;
    }

    location = /_openwebui_admin_check {
        internal;
        proxy_pass              http://openwebui/api/v1/users/?page=1;
        include /etc/nginx/includes/proxy_auth_request_headers.conf;
    }

    location @login_redirect {
        return 302 $scheme://$http_host/;
    }

    location @portal_verification_redirect {
        return 302 $scheme://$http_host/portal/account;
    }

    location @openwebui_passthrough {
        proxy_pass         http://openwebui;
        include /etc/nginx/includes/proxy_common_headers.conf;
        include /etc/nginx/includes/proxy_websocket_headers.conf;
        include /etc/nginx/includes/proxy_accept_encoding_off.conf;
        proxy_read_timeout 300s;
    }

    # ── Portal 会话验证子请求 → chat-backend（转发 Cookie 到 OpenWebUI 验证用户身份） ──
    location = /_portal_session_check {
        internal;
        proxy_pass              http://chatbackend/_internal/portal/validate-session;
        include /etc/nginx/includes/proxy_auth_request_headers.conf;
    }

    location = /_openwebui_verified_user_check {
        internal;
        proxy_pass              http://chatbackend/_internal/openwebui/verified-user-check;
        include /etc/nginx/includes/proxy_auth_request_headers.conf;
    }

    # ── Open WebUI 登录/退出与静态资源保持直通，避免未验证用户被前端错误页卡住 ──
    location ^~ /api/v1/auths/ {
        proxy_pass         http://openwebui;
        include /etc/nginx/includes/proxy_common_headers.conf;
    }

    # ── 统一导航栏静态资源 ──
    location ^~ /_xm/ {
        root /usr/share/nginx/html;
        include /etc/nginx/includes/cache_no_store.conf;
    }

    # ── Dify /webapp/permission 在自托管/非企业版会因为 EnterpriseService 调用失败而 500，
    #    React webapp 客户端在拿到这个响应前不会退出 loading spinner（即使 access mode 是 public）。
    #    我们这里直接桩成允许通过，避开上游 500，让前端继续完成初始化。──
    location = /_dify/api/webapp/permission {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"result":true}';
    }

    # ── Dify 的大体积 Next.js 静态资源不走通用 sub_filter。
    #    实测统一对所有 JS 做内容改写会让部分大 chunk 在浏览器里长时间 pending，
    #    文档始终停在 interactive，聊天页无法完成 hydration。
    #    这里改为静态资源直通，只对确实需要修正 publicPath 的 turbopack runtime 单独改写。──
    location /_dify/_next/static/ {
        rewrite ^/_dify/(.*)$ /$1 break;
        proxy_pass         ${DIFY_CHATBOT_BASE_URL};
        include /etc/nginx/includes/proxy_common_headers.conf;
        proxy_read_timeout 300s;
    }

    location ~ ^/_dify/_next/static/chunks/turbopack-.*\.js$ {
        rewrite ^/_dify/(.*)$ /$1 break;
        proxy_pass         ${DIFY_CHATBOT_BASE_URL};
        include /etc/nginx/includes/proxy_common_headers.conf;
        include /etc/nginx/includes/proxy_accept_encoding_off.conf;
        proxy_read_timeout 300s;
        sub_filter_types   application/javascript;
        sub_filter_once    off;
        sub_filter         'let t="/_next/"' 'let t="/_dify/_next/"';
    }

    # ── Dify chatbot embed 统一外部入口：浏览器始终走当前站点，不直连 localhost/内网地址 ──
    location ^~ /_dify/ {
        proxy_pass         ${DIFY_CHATBOT_BASE_URL}/;
        proxy_redirect     ~^https?://[^/]+(/.*)$ $scheme://$http_host/_dify$1;
        proxy_redirect     ~^(/.*)$ $scheme://$http_host/_dify$1;
        include /etc/nginx/includes/proxy_common_headers.conf;
        include /etc/nginx/includes/proxy_accept_encoding_off.conf;
        include /etc/nginx/includes/proxy_websocket_headers.conf;
        proxy_buffering    off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        sub_filter_types   text/html;
        sub_filter_once    off;
        sub_filter         'href="/_next/' 'href="/_dify/_next/';
        sub_filter         'src="/_next/' 'src="/_dify/_next/';
        sub_filter         '="/_next/' '="/_dify/_next/';
        sub_filter         '"/_next/' '"/_dify/_next/';
        sub_filter         'data-base-path=""' 'data-base-path="/_dify"';
        sub_filter         'data-api-prefix="/console/api"' 'data-api-prefix="/_dify/console/api"';
        sub_filter         'data-public-api-prefix="/api"' 'data-public-api-prefix="/_dify/api"';
        # Next.js 在 SSR payload 里会再写一份 JSON 形式的 data-*-api-prefix（被 React 用于客户端 hydration），
        # 必须同时改写，否则前端实际仍然请求 /api/... 与 /console/api/... 而绕过 /_dify。
        # 单引号字符串里 \" 会被 nginx 解析成普通双引号，因此匹配 HTML 内的 \" 时需要写成 \\".
        sub_filter         '\\"data-base-path\\":\\"\\"' '\\"data-base-path\\":\\"/_dify\\"';
        sub_filter         '\\"data-api-prefix\\":\\"/console/api\\"' '\\"data-api-prefix\\":\\"/_dify/console/api\\"';
        sub_filter         '\\"data-public-api-prefix\\":\\"/api\\"' '\\"data-public-api-prefix\\":\\"/_dify/api\\"';
    }

    location ^~ /_app/ {
        proxy_pass         http://openwebui;
        include /etc/nginx/includes/proxy_common_headers.conf;
    }

    location ^~ /static/ {
        proxy_pass         http://openwebui;
        include /etc/nginx/includes/proxy_common_headers.conf;
    }

    location ^~ /ws/ {
        proxy_pass         http://openwebui;
        include /etc/nginx/includes/proxy_common_headers.conf;
        include /etc/nginx/includes/proxy_websocket_headers.conf;
        proxy_read_timeout 300s;
    }

    location = /manifest.json {
        proxy_pass         http://openwebui;
        include /etc/nginx/includes/proxy_common_headers.conf;
    }

    # ── Portal 公开页面（无需登录） ──
    location = /portal/guide {
        proxy_pass         http://chatbackend;
        include /etc/nginx/includes/proxy_common_headers.conf;
        include /etc/nginx/includes/proxy_accept_encoding_off.conf;
    }

    location = /portal/products {
        proxy_pass         http://chatbackend;
        include /etc/nginx/includes/proxy_common_headers.conf;
        include /etc/nginx/includes/proxy_accept_encoding_off.conf;
    }

    location = /portal/contact/wechat-qr {
        proxy_pass         http://chatbackend;
        include /etc/nginx/includes/proxy_common_headers.conf;
        include /etc/nginx/includes/cache_no_store.conf;
    }

    location = /portal/api/public/site-contact-config {
        proxy_pass         http://chatbackend;
        include /etc/nginx/includes/proxy_common_headers.conf;
        include /etc/nginx/includes/proxy_accept_encoding_off.conf;
        include /etc/nginx/includes/cache_no_store.conf;
    }

    # ── Portal 页面 & API → chat-backend（通过 OpenWebUI Cookie 会话鉴权） ──
    location ^~ /portal {
        if ($arg_t != "") {
            return 418;
        }

        auth_request /_portal_session_check;
        auth_request_set $portal_user_id    $upstream_http_x_portal_user_id;
        auth_request_set $portal_user_email $upstream_http_x_portal_user_email;
        auth_request_set $portal_user_name  $upstream_http_x_portal_user_name;
        error_page 401 403 = @login_redirect;
        error_page 418 = @portal_token_passthrough;

        proxy_pass         http://chatbackend;
        include /etc/nginx/includes/proxy_common_headers.conf;
        include /etc/nginx/includes/proxy_accept_encoding_off.conf;
        proxy_set_header   X-Portal-User-Id     $portal_user_id;
        proxy_set_header   X-Portal-User-Email  $portal_user_email;
        proxy_set_header   X-Portal-User-Name   $portal_user_name;
    }

    location @portal_token_passthrough {
        proxy_pass         http://chatbackend;
        include /etc/nginx/includes/proxy_common_headers.conf;
        include /etc/nginx/includes/proxy_accept_encoding_off.conf;
    }

    # ── Chat-backend 管理后台（要求 Open WebUI 管理员） ──
    location ^~ /admin/backoffice {
        auth_request /_openwebui_admin_check;
        error_page 401 403 = @login_redirect;

        proxy_pass         http://chatbackend;
        include /etc/nginx/includes/proxy_common_headers.conf;
        proxy_set_header   X-Internal-Service-Secret ${CHAT_BACKEND_SERVICE_SECRET};
        proxy_set_header   X-Internal-Service-Name ${CHAT_BACKEND_TRUSTED_ADMIN_SERVICE_NAME};
        proxy_set_header   X-OpenWebUI-Admin-Verified 1;
    }

    location ^~ /admin/api/ {
        auth_request /_openwebui_admin_check;
        error_page 401 403 = @login_redirect;

        proxy_pass         http://chatbackend;
        include /etc/nginx/includes/proxy_common_headers.conf;
        proxy_set_header   X-Internal-Service-Secret ${CHAT_BACKEND_SERVICE_SECRET};
        proxy_set_header   X-Internal-Service-Name ${CHAT_BACKEND_TRUSTED_ADMIN_SERVICE_NAME};
        proxy_set_header   X-OpenWebUI-Admin-Verified 1;
    }

    # ── Open WebUI 自身的 /admin 页面（要求 Open WebUI 管理员） ──
    location ^~ /admin {
        auth_request /_openwebui_admin_check;
        error_page 401 403 = @login_redirect;

        proxy_pass         http://openwebui;
        include /etc/nginx/includes/proxy_common_headers.conf;
        include /etc/nginx/includes/proxy_websocket_headers.conf;
        proxy_read_timeout 300s;
    }

    # ── 其余所有请求 → Open WebUI ──
    location / {
        auth_request /_openwebui_verified_user_check;
        error_page 401 = @openwebui_passthrough;
        error_page 403 = @portal_verification_redirect;

        proxy_pass         http://openwebui;
        include /etc/nginx/includes/proxy_common_headers.conf;
        include /etc/nginx/includes/proxy_accept_encoding_off.conf;
        # WebSocket 支持（Open WebUI 流式输出需要）
        include /etc/nginx/includes/proxy_websocket_headers.conf;
        proxy_read_timeout 300s;
    }
}
