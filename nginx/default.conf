        proxy_pass         http://chatbackend;
        include /etc/nginx/includes/proxy_common_headers.conf;
        include /etc/nginx/includes/proxy_accept_encoding_off.conf;
        include /etc/nginx/includes/cache_no_store.conf;
    }

    location = /portal/api/public/password-reset/confirm {
        proxy_pass         http://chatbackend;
        include /etc/nginx/includes/proxy_common_headers.conf;
        include /etc/nginx/includes/proxy_accept_encoding_off.conf;
        include /etc/nginx/includes/cache_no_store.conf;
    }

    location = /_portal_email_verification_request_guard {
        internal;
        proxy_pass              http://chatbackend/_internal/portal/email-verification/request-guard;
        include /etc/nginx/includes/proxy_auth_request_headers.conf;
    }

    location = /_portal_email_verification_confirm_guard {
        internal;
        proxy_pass              http://chatbackend/_internal/portal/email-verification/confirm-guard;
        include /etc/nginx/includes/proxy_auth_request_headers.conf;
    }

    location @portal_email_verification_request_rate_limited {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Retry-After $portal_guard_retry_after always;
        return 429 '{"detail":"验证码发送过于频繁，请稍后再试"}';
    }

    location @portal_email_verification_confirm_rate_limited {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Retry-After $portal_guard_retry_after always;
        return 429 '{"detail":"验证码校验过于频繁，请稍后再试"}';
    }

    location = /portal/api/account/email-verification/request {
        if ($arg_t != "") {
            return 418;
        }

        auth_request /_portal_email_verification_request_guard;
        auth_request_set $portal_user_id       $upstream_http_x_portal_user_id;
        auth_request_set $portal_user_email    $upstream_http_x_portal_user_email;
        auth_request_set $portal_user_name     $upstream_http_x_portal_user_name;
        auth_request_set $portal_guard_retry_after $upstream_http_x_portal_guard_retry_after;
        error_page 401 = @login_redirect;
        error_page 403 = @portal_email_verification_request_rate_limited;
        error_page 418 = @portal_token_passthrough;

        proxy_pass         http://chatbackend;
        include /etc/nginx/includes/proxy_common_headers.conf;
        include /etc/nginx/includes/proxy_accept_encoding_off.conf;
        proxy_set_header   X-Portal-User-Id     $portal_user_id;
        proxy_set_header   X-Portal-User-Email  $portal_user_email;
        proxy_set_header   X-Portal-User-Name   $portal_user_name;
    }

    location = /portal/api/account/email-verification/confirm {
        if ($arg_t != "") {
            return 418;
        }

        auth_request /_portal_email_verification_confirm_guard;
        auth_request_set $portal_user_id       $upstream_http_x_portal_user_id;
        auth_request_set $portal_user_email    $upstream_http_x_portal_user_email;
        auth_request_set $portal_user_name     $upstream_http_x_portal_user_name;
        auth_request_set $portal_guard_retry_after $upstream_http_x_portal_guard_retry_after;
        error_page 401 = @login_redirect;
        error_page 403 = @portal_email_verification_confirm_rate_limited;
        error_page 418 = @portal_token_passthrough;

        proxy_pass         http://chatbackend;
        include /etc/nginx/includes/proxy_common_headers.conf;
        include /etc/nginx/includes/proxy_accept_encoding_off.conf;
        proxy_set_header   X-Portal-User-Id     $portal_user_id;
        proxy_set_header   X-Portal-User-Email  $portal_user_email;
        proxy_set_header   X-Portal-User-Name   $portal_user_name;
    }

    # ── Portal 页面 & API → chat-backend（通过 OpenWebUI Cookie 会话鉴权） ──
    location ^~ /portal {
        if ($arg_t != "") {
            return 418;
        }

        auth_request /_portal_session_check;
        auth_request_set $portal_user_id    $upstream_http_x_portal_user_id;
        auth_request_set $portal_user_email $upstream_http_x_portal_user_email;
        auth_request_set $portal_user_name  $upstream_http_x_portal_user_name;
        error_page 401 403 = @login_redirect;
        error_page 409 = @session_expired_redirect;
        error_page 418 = @portal_token_passthrough;

        proxy_pass         http://chatbackend;
        include /etc/nginx/includes/proxy_common_headers.conf;
        include /etc/nginx/includes/proxy_accept_encoding_off.conf;
        proxy_set_header   X-Portal-User-Id     $portal_user_id;
        proxy_set_header   X-Portal-User-Email  $portal_user_email;
        proxy_set_header   X-Portal-User-Name   $portal_user_name;
    }

    location @portal_token_passthrough {
        proxy_pass         http://chatbackend;
        include /etc/nginx/includes/proxy_common_headers.conf;
        include /etc/nginx/includes/proxy_accept_encoding_off.conf;
    }

    # ── Chat-backend 管理后台（要求 Open WebUI 管理员） ──
    location ^~ /admin/backoffice {
        auth_request /_openwebui_admin_check;
        error_page 401 403 = @login_redirect;

        proxy_pass         http://chatbackend;
        include /etc/nginx/includes/proxy_common_headers.conf;
        proxy_set_header   X-Internal-Service-Secret ${CHAT_BACKEND_SERVICE_SECRET};
        proxy_set_header   X-Internal-Service-Name ${CHAT_BACKEND_TRUSTED_ADMIN_SERVICE_NAME};
        proxy_set_header   X-OpenWebUI-Admin-Verified 1;
    }

    location ^~ /admin/api/ {
        auth_request /_openwebui_admin_check;
        error_page 401 403 = @login_redirect;

        proxy_pass         http://chatbackend;
        include /etc/nginx/includes/proxy_common_headers.conf;
        proxy_set_header   X-Internal-Service-Secret ${CHAT_BACKEND_SERVICE_SECRET};
        proxy_set_header   X-Internal-Service-Name ${CHAT_BACKEND_TRUSTED_ADMIN_SERVICE_NAME};
        proxy_set_header   X-OpenWebUI-Admin-Verified 1;
    }

    # ── Open WebUI 自身的 /admin 页面（要求 Open WebUI 管理员） ──
    location ^~ /admin {
        auth_request /_openwebui_admin_check;
        error_page 401 403 = @login_redirect;

        proxy_pass         http://openwebui;
        include /etc/nginx/includes/proxy_common_headers.conf;
        include /etc/nginx/includes/proxy_websocket_headers.conf;
        proxy_read_timeout 300s;
    }

    # ── 其余所有请求 → Open WebUI ──
    location / {
        auth_request /_openwebui_verified_user_check;
        error_page 401 = @openwebui_passthrough;
        error_page 403 = @portal_verification_redirect;
        error_page 409 = @session_expired_redirect;

        proxy_pass         http://openwebui;
        include /etc/nginx/includes/proxy_common_headers.conf;
        include /etc/nginx/includes/proxy_accept_encoding_off.conf;
        # WebSocket 支持（Open WebUI 流式输出需要）
        include /etc/nginx/includes/proxy_websocket_headers.conf;
        proxy_read_timeout 300s;
    }

    location @session_expired_redirect {
        add_header Set-Cookie "xm_device_session=; Max-Age=0; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/; SameSite=Lax" always;
        return 302 $scheme://$http_host/portal/session-expired;
    }
}
