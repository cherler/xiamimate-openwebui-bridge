services:
  nginx:
    image: ${OPEN_WEBUI_NGINX_IMAGE:-nginx:latest}
    restart: unless-stopped
    environment:
      CHAT_BACKEND_SERVICE_SECRET: ${CHAT_BACKEND_SERVICE_SECRET}
      CHAT_BACKEND_TRUSTED_ADMIN_SERVICE_NAME: ${CHAT_BACKEND_TRUSTED_ADMIN_SERVICE_NAME:-openwebui-bridge-admin}
      DIFY_CHATBOT_BASE_URL: ${DIFY_CHATBOT_BASE_URL:-http://host.docker.internal:80}
    ports:
      - "${OPEN_WEBUI_PORT:-3002}:8080"
    volumes:
      - ./nginx/default.conf:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/includes:/etc/nginx/includes:ro
      - ./nginx/xm-nav.css:/usr/share/nginx/html/_xm/nav.css:ro
      - ./nginx/xm-nav.js:/usr/share/nginx/html/_xm/nav.js:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - open-webui

  open-webui:
    image: ${OPEN_WEBUI_IMAGE:-ghcr.io/open-webui/open-webui:main}
    restart: unless-stopped
    environment:
      OPENAI_API_BASE_URL: http://pipelines:9099/v1
      OPENAI_API_KEY: ${PIPELINES_API_KEY}
      WEBUI_SECRET_KEY: ${OPEN_WEBUI_SECRET_KEY}
    volumes:
      - ./data/open-webui:/app/backend/data
      - ./tools:/opt/xiamimate/tools:ro
    depends_on:
      - pipelines

  pipelines:
    image: ${PIPELINES_IMAGE:-ghcr.io/open-webui/pipelines:main}
    restart: unless-stopped
    ports:
      - "${PIPELINES_PORT:-9099}:9099"
    environment:
      PIPELINES_API_KEY: ${PIPELINES_API_KEY}
      PIPELINES_DIR: /app/pipelines
      XIAMIMATE_MODEL_PREFIX: ${XIAMIMATE_MODEL_PREFIX:-xiamimate}
      CHAT_BACKEND_BASE_URL: ${CHAT_BACKEND_BASE_URL:-http://chat-backend:8200}
      CHAT_BACKEND_TIMEOUT: ${CHAT_BACKEND_TIMEOUT:-180}
      CHAT_BACKEND_SERVICE_SECRET: ${CHAT_BACKEND_SERVICE_SECRET}
      CHAT_BACKEND_SERVICE_NAME: ${CHAT_BACKEND_SERVICE_NAME:-open-webui-pipeline}
      DIFY_REQUEST_TIMEOUT: ${DIFY_REQUEST_TIMEOUT:-180}
      DIFY_REPORT_RESEARCH_APP_API_KEY: ${DIFY_REPORT_RESEARCH_APP_API_KEY:-}
      AGENT_OPENAI_MODEL: ${AGENT_OPENAI_MODEL:-deepseek-v4-pro}
      AGENT_ANTHROPIC_MODEL: ${AGENT_ANTHROPIC_MODEL:-MiniMax-M2.7-highspeed}
      AGENT_MODEL_DEFAULT_PROFILE: ${AGENT_MODEL_DEFAULT_PROFILE:-deepseek}
      AGENT_MODEL_PROFILES: ${AGENT_MODEL_PROFILES:-deepseek,minimax}
      AGENT_MODEL_DEEPSEEK_LABEL: "${AGENT_MODEL_DEEPSEEK_LABEL:-DeepSeek V4 Pro}"
      AGENT_MODEL_MINIMAX_LABEL: "${AGENT_MODEL_MINIMAX_LABEL:-MiniMax M2.7}"
    volumes:
      - ./pipelines:/app/pipelines
      - ./tools:/app/tools:ro